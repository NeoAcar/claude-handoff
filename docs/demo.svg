<text x="24" y="356" class="ok" opacity="0" xml:space="preserve">✓ “Fix upload timeout” resumes on Neo’s machine with its full history<animate attributeName="opacity" dur="24.200000000000003s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.8719"/></text>
