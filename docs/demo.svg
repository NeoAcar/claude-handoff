<text x="24" y="116" class="d" opacity="0" xml:space="preserve">Updating 3f2a1c9..8d4e7b2<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5652"/></text>
<text x="24" y="164" class="p neo" opacity="0" xml:space="preserve">neo:~/myproject$ <animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5891"/></text>
<text x="157.1" y="164" class="c" clip-path="url(#c3)" xml:space="preserve">claude-handoff import</text>
<rect y="151" width="8" height="16" class="cur" opacity="0"><animate attributeName="x" dur="23.0s" repeatCount="indefinite" values="157.1;157.1;323.5;323.5" keyTimes="0.0000;0.6043;0.6565;1.0000"/><animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.5891;0.6761"/></rect>
<text x="24" y="188" class="o" opacity="0" xml:space="preserve">  Imported: 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f.jsonl — Fix upload timeout (3 artifact(s) + 2 sidecar(s))<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6783"/></text>
<text x="24" y="212" class="o" opacity="0" xml:space="preserve">Imported 1 session(s)<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6913"/></text>
<text x="24" y="236" class="d" opacity="0" xml:space="preserve">Or jump straight in:<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7043"/></text>
<text x="24" y="260" class="d" opacity="0" xml:space="preserve">  claude --resume 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7130"/></text>
