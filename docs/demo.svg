<text x="24" y="188" class="o" opacity="0" xml:space="preserve">  Imported: 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f.jsonl — Fix upload timeout (3 artifact(s) + 2 sidecar(s))<animate attributeName="opacity" dur="24.200000000000003s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6942"/></text>
