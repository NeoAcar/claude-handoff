<text x="450.0" y="27" class="tab" text-anchor="middle">① Alice's machine — export</text>
<text x="24" y="92" class="p alice" opacity="0" xml:space="preserve">alice:~/myproject$ <animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.0196"/></text>
<text x="172.8" y="92" class="c" clip-path="url(#c0)" xml:space="preserve">claude-handoff export --session &quot;upload&quot;</text>
<rect y="79" width="8" height="16" class="cur" opacity="0"><animate attributeName="x" dur="23.0s" repeatCount="indefinite" values="172.8;172.8;488.0;488.0" keyTimes="0.0000;0.0348;0.1217;1.0000"/><animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0196;0.1413"/></rect>
<text x="24" y="116" class="o" opacity="0" xml:space="preserve">  Exported: 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f/ — Fix upload timeout (212 records + 2 sidecar(s))<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1435"/></text>
<text x="24" y="140" class="o" opacity="0" xml:space="preserve">Exported 1 session(s) to .claude-shared/<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1565"/></text>
<text x="24" y="164" class="w" opacity="0" xml:space="preserve">Redacted: 3 unique secret(s), 5 marker(s) written across fields<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1696"/></text>
<text x="24" y="188" class="d" opacity="0" xml:space="preserve">Before committing, run: git diff .claude-shared/<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1826"/></text>
<text x="24" y="236" class="p alice" opacity="0" xml:space="preserve">alice:~/myproject$ <animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.2283"/></text>
<text x="172.8" y="236" class="c" clip-path="url(#c1)" xml:space="preserve">git add .claude-shared &amp;&amp; git commit -m &quot;handoff&quot; &amp;&amp; git push</text>
<rect y="223" width="8" height="16" class="cur" opacity="0"><animate attributeName="x" dur="23.0s" repeatCount="indefinite" values="172.8;172.8;652.4;652.4" keyTimes="0.0000;0.2435;0.3652;1.0000"/><animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2283;0.3848"/></rect>
<text x="24" y="260" class="d" opacity="0" xml:space="preserve">   3f2a1c9..8d4e7b2  main -&gt; main<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.3913"/></text>
<text x="24" y="308" class="n" opacity="0" xml:space="preserve">→ the session now travels with the repo<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.4174"/></text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4870;1.0000"/>
