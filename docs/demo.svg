<text x="157.1" y="308" class="c" clip-path="url(#c4)" xml:space="preserve">claude --resume 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f</text>
<rect y="295" width="8" height="16" class="cur" opacity="0"><animate attributeName="x" dur="23.0s" repeatCount="indefinite" values="157.1;157.1;566.3;566.3" keyTimes="0.0000;0.7565;0.8348;1.0000"/><animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.7413;0.8543"/></rect>
<text x="24" y="356" class="ok" opacity="0" xml:space="preserve">✓ “Fix upload timeout” resumes on Neo’s machine with its full history<animate attributeName="opacity" dur="23.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.8652"/></text>
