<text x="450.0" y="27" class="tab" text-anchor="middle">① Alice's machine — export</text>
<text x="24" y="92" class="p alice" opacity="0" xml:space="preserve">alice:~/myproject$ <animate attributeName="opacity" dur="24.200000000000003s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.0186"/></text>
<text x="172.8" y="92" class="c" clip-path="url(#c0)" xml:space="preserve">claude-handoff export &quot;upload&quot;</text>
