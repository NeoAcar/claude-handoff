<text x="24" y="236" class="d" opacity="0" xml:space="preserve">Or jump straight in:<animate attributeName="opacity" dur="24.200000000000003s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7190"/></text>
<text x="24" y="260" class="d" opacity="0" xml:space="preserve">  claude --resume 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f<animate attributeName="opacity" dur="24.200000000000003s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7273"/></text>
