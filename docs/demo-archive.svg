<rect width="900" height="304" rx="10" fill="#0d1117"/>
<rect width="900" height="42" rx="10" fill="#161b22"/><rect y="32" width="900" height="10" fill="#161b22"/>
<rect x="0.5" y="0.5" width="899" height="303" rx="10" fill="none" stroke="#30363d"/>
<circle cx="22" cy="21" r="6" fill="#ff5f56"/><circle cx="42" cy="21" r="6" fill="#ffbd2e"/><circle cx="62" cy="21" r="6" fill="#27c93f"/>
<g opacity="1"><animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0.0000;0.4725"/>
<text x="450.0" y="27" class="tab" text-anchor="middle">① Sender — no shared repo</text>
<text x="24" y="92" class="p alice" opacity="0" xml:space="preserve">alice:~/myproject$ <animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.0247"/></text>
<text x="172.8" y="92" class="c" clip-path="url(#c0)" xml:space="preserve">claude-handoff export -n 1 -o</text>
<rect y="79" width="8" height="16" class="cur" opacity="0"><animate attributeName="x" dur="18.2s" repeatCount="indefinite" values="172.8;172.8;401.8;401.8" keyTimes="0.0000;0.0440;0.1319;1.0000"/><animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0247;0.1566"/></rect>
<text x="24" y="116" class="n" opacity="0" xml:space="preserve">Known secret values to scrub: 2 (DB_PASSWORD, STRIPE_SECRET_KEY) from .env, the environment<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1593"/></text>
<text x="24" y="140" class="o" opacity="0" xml:space="preserve">  Exported: 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f/ — Fix login bug (212 records + 2 sidecar(s))<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1868"/></text>
<text x="24" y="164" class="o" opacity="0" xml:space="preserve">Exported 1 session(s)<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.2033"/></text>
<text x="24" y="188" class="w" opacity="0" xml:space="preserve">Redacted: 5 unique secret(s), 8 marker(s) written across fields<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.2198"/></text>
<text x="24" y="212" class="o" opacity="0" xml:space="preserve">Wrote /home/alice/myproject/fix-login-bug.handoff (148.3 KB)<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.2473"/></text>
<text x="24" y="260" class="n" opacity="0" xml:space="preserve">→ one checksummed file: send it any way you like<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.3077"/></text>
