<text x="157.1" y="212" class="c" clip-path="url(#c2)" xml:space="preserve">claude --resume 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f</text>
<rect y="199" width="8" height="16" class="cur" opacity="0"><animate attributeName="x" dur="18.2s" repeatCount="indefinite" values="157.1;157.1;566.3;566.3" keyTimes="0.0000;0.7363;0.8352;1.0000"/><animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.7170;0.8599"/></rect>
<text x="24" y="260" class="ok" opacity="0" xml:space="preserve">✓ “Fix login bug” resumes with its full history — no repo involved<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.8736"/></text>
