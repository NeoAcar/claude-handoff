<clipPath id="c1"><rect x="157.1" y="76" width="0.0" height="22"><animate attributeName="width" dur="18.2s" repeatCount="indefinite" values="0;0;338.7;338.7" keyTimes="0.0000;0.5110;0.6099;1.0000"/></rect></clipPath>
<clipPath id="c2"><rect x="157.1" y="196" width="0.0" height="22"><animate attributeName="width" dur="18.2s" repeatCount="indefinite" values="0;0;409.2;409.2" keyTimes="0.0000;0.7363;0.8352;1.0000"/></rect></clipPath>
