.p { font-weight: 600; } .alice { fill: #f778ba; } .neo { fill: #39c5cf; }
.tab { fill: #c9d1d9; font-size: 13px; font-weight: 600; } .cur { fill: #c9d1d9; }
</style>
<defs>
