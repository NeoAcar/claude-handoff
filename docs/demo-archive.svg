<text x="24" y="92" class="p neo" opacity="0" xml:space="preserve">neo:~/myproject$ <animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.4918"/></text>
<text x="157.1" y="92" class="c" clip-path="url(#c1)" xml:space="preserve">claude-handoff import fix-login-bug.handoff</text>
