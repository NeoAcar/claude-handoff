<text x="24" y="116" class="n" opacity="0" xml:space="preserve">Archive verified: 6 file(s), written by claude-handoff 0.3.0<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6374"/></text>
<text x="24" y="140" class="o" opacity="0" xml:space="preserve">  Imported: 084c4bf8-2d1e-4c7a-9b3f-5e6a7c8d9e0f.jsonl — Fix login bug (3 artifact(s) + 2 sidecar(s))<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6648"/></text>
<text x="24" y="164" class="o" opacity="0" xml:space="preserve">Imported 1 session(s)<animate attributeName="opacity" dur="18.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6813"/></text>
